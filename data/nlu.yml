version: "3.1"

nlu:
- intent: greet
  examples: |
    - Γειά σου
    - Γειά σου!
    - Γειά σας
    - Γειά σας!
    - Χαίρετε
    - Χαίρετε!
    - Γειά
    - Γειά σου, πώς είσαι;
    - Γειά σας, πώς είστε;

- intent: goodbye
  examples: |
    - αντίο
    - αντίο σου
    - αντίο σας
    - χάρηκα
    - χάρηκα πολύ
    - χάρηκα για τη βοήθειά σου
    - χάρηκα για τη βοήθειά σας

- intent: affirm
  examples: |
    - ναι
    - σίγουρα
    - φυσικά
    - βεβαίως
    - σωστά
    - ακριβώς
    - συμφωνώ
    - εντάξει
    - οκ
    - πάμε

- intent: deny
  examples: |
    - όχι
    - δεν θέλω
    - ποτέ
    - δεν νομίζω
    - μάλλον όχι

- intent: ask_question
  examples: |
    - Τι είναι αλγόριθμος;
    - Τι είναι πρόγραμμα;
    - Τι είναι δεδομένα;
    - Τι κάνει ο υπολογιστής;
    - Πως λειτουργεί ο υπολογιστής;
    - Τι είναι η μνήμη;
    - Πως γράφουμε αλγόριθμους;
    - Τι είναι η γλώσσα προγραμματισμού;
    - Τι είναι η γλώσσα Python;
    - Τι είναι η γλώσσα Java;
    - θέλω να μάθω για τους αλγόριθμους
    - θέλω να μάθω για τα προγράμματα
    - θέλω να μάθω για τα δεδομένα

- intent: not_understood_by_student
  examples: |
    - δεν κατάλαβα
    - μπορείς να το εξηγήσεις πιο απλά;
    - δεν το καταλαβαίνω
    - δεν βγάζει νόημα αυτό
    - μπορείς να μου το πεις πιο εύκολα;
    - δεν ξέρω τι σημαίνει αυτό
    - δεν κατάλαβα την απάντηση
    - μπορείς να το ξαναπείς;
    - με μπερδεύει αυτό

- intent: request_exercises
  examples: |
    - φτιάξε μου ασκήσεις
    - θέλω ασκήσεις
    - δώσε μου 5 ασκήσεις για την ενότητα 10
    - δημιούργησε 10 πολλαπλής επιλογής
    - θέλω σωστό λάθος για την τηλεϊατρική
    - γράψε μου ένα κουίζ για το μάθημα
    - κάνε μου ερωτήσεις τι είναι το web 2.0

- intent: answer_exercise
  examples: |
    - α
    - β
    - γ
    - δ
    - a
    - b
    - c
    - d
    - σωστό
    - λάθος
    - σωστη
    - λαθος
